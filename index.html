<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QORT - بثوث Kick المباشرة</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b0e0f;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
        }
        h1 { color: #53fc18; margin-bottom: 15px; text-align: center; font-size: 22px; }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 1000px;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #53fc18;
            background: #192320;
            color: #fff;
            font-size: 16px;
        }
        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .play-btn {
            background: #53fc18;
            color: #000;
        }
        .chat-toggle-btn {
            background: #1e2c24;
            color: #53fc18;
            border: 1px solid #53fc18;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 1000px;
        }
        .player-wrapper {
            display: flex;
            gap: 15px;
            width: 100%;
            height: 500px;
        }
        .video-container {
            flex: 1;
            height: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            border: 1px solid #28382c;
        }
        .chat-container {
            width: 320px;
            height: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            border: 1px solid #28382c;
            display: block; /* افتراضياً يظهر عند التشغيل */
        }
        iframe { width: 100%; height: 100%; border: none; }

        .direct-btn {
            display: none;
            text-align: center;
            background: #192320;
            border: 1px solid #53fc18;
            color: #53fc18;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .section-title {
            color: #53fc18;
            font-size: 18px;
            margin-bottom: 10px;
            border-bottom: 1px solid #28382c;
            padding-bottom: 5px;
        }

        .streamers-section {
            background: #131b18;
            border: 1px solid #28382c;
            border-radius: 12px;
            padding: 15px;
        }
        
        .streamer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 8px;
            margin-bottom: 20px;
        }
        
        .streamer-btn {
            background: #1e2c24;
            color: #fff;
            border: 1px solid #36503c;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .streamer-btn:hover {
            background: #53fc18;
            color: #000;
        }

        @media (max-width: 768px) {
            .player-wrapper {
                flex-direction: column;
                height: auto;
            }
            .video-container { height: 300px; }
            .chat-container { width: 100%; height: 400px; }
        }
    </style>
</head>
<body>

    <h1>🎬 مشاهدة بثوث Kick المباشرة</h1>

    <div class="controls">
        <input type="text" id="channelName" placeholder="اكتب اسم القناة..." />
        <button class="play-btn" onclick="playChannel()">تشغيل</button>
        <button class="chat-toggle-btn" id="toggleChatBtn" onclick="toggleChat()">💬 إخفاء الچات</button>
    </div>

    <div class="main-container">
        <div class="player-wrapper">
            <div class="video-container">
                <iframe id="player" src="about:blank" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
            </div>
            <div class="chat-container" id="chatBox">
                <iframe id="chatPlayer" src="about:blank"></iframe>
            </div>
        </div>

        <a id="externalLink" href="#" target="_blank" class="direct-btn">🔗 فتح القناة مباشرة عبر التطبيق / الموقع</a>

        <div class="streamers-section">
            <div class="section-title">قائمة Mystery Town (mt)</div>
            <div class="streamer-grid" id="mtList"></div>

            <div class="section-title">أشهر ستريمرز Kick (Top 20)</div>
            <div class="streamer-grid" id="top20List"></div>
        </div>
    </div>

    <script>
        const mtStreamers = [
            "ABOKYAN", "Basamlv", "s6mito", "DrFx", "brof2", "Fahad", "Firas", 
            "xEiD", "i3SW", "Majah92", "xlxwi", "OSAMAH", "AbuSwe7l", "tmnaa", 
            "Vilon", "Azzz", "Abunoo7", "Muvxn", "SXB", "RpWy", "ALKRKY99", 
            "vFernando", "JASER", "MortadaRadawy", "AhmedNemesis", "oPiiLz"
        ];

        const top20Streamers = [
            "xQc", "AdinRoss", "Amouranth", "Hikaru", "WestCOL", "Davooxeneize",
            "absi", "SHERO", "bo3of", "oPiiLz", "abuswe7l", "3mr", "abu_abeer16",
            "firas", "SXB", "Azza", "trainwreckstv", "roshtein", "mizkif", "yassuo"
        ];

        let isChatVisible = true;

        function createButtons(list, containerId) {
            const container = document.getElementById(containerId);
            list.forEach(name => {
                const btn = document.createElement('button');
                btn.className = 'streamer-btn';
                btn.innerText = name;
                btn.onclick = () => {
                    document.getElementById('channelName').value = name;
                    loadStream(name);
                };
                container.appendChild(btn);
            });
        }

        function playChannel() {
            let channel = document.getElementById('channelName').value.trim();
            if(!channel) return alert("يرجى إدخال اسم القناة!");
            loadStream(channel);
        }

        function loadStream(channel) {
            channel = channel.replace("https://kick.com/", "").replace("/", "").trim();
            
            // تشغيل مشغل البث
            document.getElementById('player').src = `https://player.kick.com/${channel}`;
            
            // تشغيل الچات المباشر
            document.getElementById('chatPlayer').src = `https://kick.com/popout/${channel}/chat`;
            
            // رابط احتياطي
            const extLink = document.getElementById('externalLink');
            extLink.href = `https://kick.com/${channel}`;
            extLink.style.display = "block";
        }

        function toggleChat() {
            const chatBox = document.getElementById('chatBox');
            const toggleBtn = document.getElementById('toggleChatBtn');
            
            if (isChatVisible) {
                chatBox.style.display = 'none';
                toggleBtn.innerText = '💬 إظهار الچات';
                isChatVisible = false;
            } else {
                chatBox.style.display = 'block';
                toggleBtn.innerText = '💬 إخفاء الچات';
                isChatVisible = true;
            }
        }

        createButtons(mtStreamers, 'mtList');
        createButtons(top20Streamers, 'top20List');
    </script>

</body>
</html>
