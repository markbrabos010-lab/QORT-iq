<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QORT — بثوث Kick • تسجيل • كليبات</title>
<!-- إعدادات PWA -->
<link rel="manifest" href='data:application/manifest+json,{"name":"QORT","short_name":"QORT","start_url":".","display":"standalone","background_color":"#070b09","theme_color":"#53fc18","icons":[{"src":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=","sizes":"192x192","type":"image/png"}]}'>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070b09">

<style>
:root{
  --bg:#070b09; --panel:#0f1713; --panel2:#141f19; --line:#1f2f27;
  --green:#53fc18; --green2:#2ee06a; --text:#e9f6ee; --muted:#7d9488;
  --danger:#ff5a5a; --radius:16px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background: radial-gradient(1200px 600px at 100% -10%, rgba(83,252,24,.13), transparent 60%), radial-gradient(900px 500px at -10% 5%, rgba(46,224,106,.08), transparent 60%), var(--bg);
  color:var(--text); font-family:"Segoe UI",Tahoma,Arial,sans-serif; min-height:100vh;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#0a120e}
::-webkit-scrollbar-thumb{background:#22382c;border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:#2f5240}

/* Header */
.topbar{
  position:sticky;top:0;z-index:50; display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 20px; background:rgba(7,11,9,.75); backdrop-filter:blur(14px); border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:12px}
.logo{font-size:24px;font-weight:900;letter-spacing:2px; background:linear-gradient(135deg,#53fc18,#2ee06a 60%,#18fcd6); -webkit-background-clip:text;background-clip:text;color:transparent; filter:drop-shadow(0 0 14px rgba(83,252,24,.35));}
.tagline{font-size:12px;color:var(--muted)}
.rec-pill{ display:inline-flex;align-items:center;gap:8px; font-size:13px;font-weight:700;color:var(--muted); background:var(--panel);border:1px solid var(--line); padding:8px 14px;border-radius:999px;}
.rec-pill .dot{width:9px;height:9px;border-radius:50%;background:#3b4a42}
.rec-pill.on{color:#ff7676;border-color:rgba(255,60,60,.45);background:rgba(255,45,45,.1)}
.rec-pill.on .dot{background:#ff2d2d;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,45,45,.7)}50%{box-shadow:0 0 0 8px rgba(255,45,45,0)}}

.wrap{max-width:1280px;margin:0 auto;padding:18px 16px 60px}

/* Controls */
.searchbar{ display:flex;gap:10px;flex-wrap:wrap;align-items:center; background:linear-gradient(180deg,var(--panel),#0c1410); border:1px solid var(--line); border-radius:var(--radius); padding:12px; box-shadow:0 10px 30px rgba(0,0,0,.45);}
.searchbar input[type="text"]{ flex:1;min-width:220px; padding:13px 16px;border-radius:12px; border:1px solid var(--line); background:#0a120e;color:var(--text); font-size:15px;font-family:inherit;outline:none; transition:.18s;}
.searchbar input[type="text"]:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(83,252,24,.12)}
.btn{ display:inline-flex;align-items:center;gap:7px;justify-content:center; padding:12px 16px;border-radius:12px; border:1px solid transparent; background:var(--panel2);color:var(--text); font-weight:700;font-size:14px;font-family:inherit; cursor:pointer;transition:.18s;white-space:nowrap;}
.btn:hover{transform:translateY(-1px)}
.btn.primary{ background:linear-gradient(135deg,#53fc18,#2ee06a); color:#04120a;box-shadow:0 8px 22px rgba(83,252,24,.22);}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ghost:hover{border-color:var(--green);color:var(--green)}
.btn.rec{background:rgba(255,60,60,.1);border-color:rgba(255,60,60,.35);color:#ff6b6b}
.btn.rec:hover{background:rgba(255,60,60,.18)}
.btn.rec.active{background:#ff2d2d;color:#fff;border-color:#ff2d2d;animation:pulse 1.4s infinite}

/* Layout Toggles */
.layout-toggles{display:flex;gap:6px;background:var(--panel);padding:4px;border-radius:12px;border:1px solid var(--line);}
.layout-btn{background:transparent;border:0;color:var(--muted);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;transition:0.2s;}
.layout-btn.active{background:var(--panel2);color:var(--green);}

/* Stage & Multi-Stream */
.stage{ display:grid;grid-template-columns:1fr 340px;gap:14px; margin-top:14px;align-items:stretch;}
.stage.no-chat{grid-template-columns:1fr}
.video-grid{display:grid;gap:8px;width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.6);}
.video-grid.layout-1{grid-template-columns:1fr;}
.video-grid.layout-2{grid-template-columns:1fr 1fr;}
.video-grid.layout-4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;}
.video-slot{position:relative;background:#000;overflow:hidden;}
.video-slot iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.video-foot{ display:flex;align-items:center;justify-content:space-between;gap:10px; padding:10px 14px;background:linear-gradient(180deg,#0d1611,#0a120e); border-top:1px solid var(--line);font-size:13px;color:var(--muted);}
.chat-card{ background:#000;border:1px solid var(--line);border-radius:var(--radius); overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.6);min-height:320px;}
.chat-card iframe{width:100%;height:100%;border:0;display:block}

/* Panels & Streamers */
.panel{ background:linear-gradient(180deg,var(--panel),#0b1310); border:1px solid var(--line);border-radius:var(--radius); padding:16px;margin-top:16px; box-shadow:0 10px 30px rgba(0,0,0,.35);}
.panel-head{ display:flex;align-items:center;justify-content:space-between;gap:10px; border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px;}
.panel-head h2{margin:0;font-size:17px;color:var(--green);font-weight:800}
.streamer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:9px}
.streamer-item{ display:flex;align-items:center;overflow:hidden; background:var(--panel2);border:1px solid var(--line);border-radius:10px; transition:.18s;}
.streamer-item:hover{border-color:var(--green);transform:translateY(-2px)}
.streamer-btn{ flex:1;background:transparent;border:0;color:var(--text); padding:11px 9px;font-size:13px;font-family:inherit;font-weight:600; cursor:pointer;text-align:center; white-space:nowrap;overflow:hidden;text-overflow:ellipsis; display:flex; align-items:center; gap:6px; justify-content:center;}
.streamer-item:hover .streamer-btn{color:var(--green)}
.live-dot{width:8px;height:8px;border-radius:50%;background:#3b4a42;flex-shrink:0;}
.live-dot.on{background:#ff2d2d;box-shadow:0 0 8px #ff2d2d;animation:pulse 1.5s infinite;}
.remove-btn{ background:transparent;border:0;color:#5d6f65; padding:11px 10px;font-size:12px;cursor:pointer;transition:.15s;}
.remove-btn:hover{color:#fff;background:var(--danger)}

/* Clips Grid */
.clips-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.clip-card{ background:var(--panel2);border:1px solid var(--line);border-radius:14px; overflow:hidden;transition:.2s;}
.clip-card:hover{border-color:#2f5240;transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.5)}
.clip-thumb{ position:relative;aspect-ratio:16/9;background:#0a120e center/cover no-repeat; display:flex;align-items:center;justify-content:center;}
.clip-thumb .play{ width:46px;height:46px;border-radius:50%;border:0;cursor:pointer; background:rgba(83,252,24,.9);color:#04120a;font-size:18px; display:flex;align-items:center;justify-content:center; transition:.18s;padding-right:4px;}
.clip-thumb .play:hover{transform:scale(1.1);background:var(--green)}
.clip-dur{ position:absolute;bottom:8px;left:8px; background:rgba(0,0,0,.8);color:#fff;font-size:11px;font-weight:700; padding:3px 8px;border-radius:6px;}
.clip-body{padding:10px 12px 12px}
.clip-name{font-size:13.5px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip-meta{font-size:11.5px;color:var(--muted);margin-bottom:10px}
.clip-actions{display:flex;gap:6px}
.clip-actions button{ flex:1;padding:8px;border-radius:9px;border:1px solid var(--line); background:#0d1712;color:var(--text);font-size:12px;font-weight:700; cursor:pointer;font-family:inherit;transition:.15s;}
.clip-actions button:hover{border-color:var(--green);color:var(--green)}
.clip-actions button.danger:hover{border-color:var(--danger);color:var(--danger)}

/* Modals */
.modal{ position:fixed;inset:0;z-index:120;display:none; align-items:center;justify-content:center;padding:16px; background:rgba(3,7,5,.78);backdrop-filter:blur(6px);}
.modal.show{display:flex}
.modal-card{ width:100%;max-width:820px;max-height:92vh;overflow:auto; background:linear-gradient(180deg,#101a15,#0a120e); border:1px solid #26382f;border-radius:18px; padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.8);}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-head h3{margin:0;font-size:17px;color:var(--green)}
.icon-btn{ background:transparent;border:1px solid var(--line);color:var(--muted); width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:15px; transition:.15s;font-family:inherit;}
.icon-btn:hover{border-color:var(--danger);color:var(--danger)}
.modal video{ width:100%;border-radius:12px;background:#000;display:block; max-height:46vh;}

.trim-wrap{margin:16px 0}
.trim-track{ position:relative;height:12px;border-radius:8px;background:#0a120e; border:1px solid var(--line);overflow:hidden;margin-bottom:14px;}
.trim-range{ position:absolute;top:0;bottom:0; background:linear-gradient(90deg,#53fc18,#2ee06a); opacity:.55;border-radius:6px;}
.trim-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.trim-row label{font-size:12.5px;color:var(--muted);min-width:74px}
.trim-row output{font-size:12.5px;color:var(--green);font-weight:700;min-width:56px;text-align:left}
input[type=range]{ -webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:5px; background:#1c2a23;outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none;width:17px;height:17px;border-radius:50%; background:var(--green);border:3px solid #0a120e;cursor:pointer; box-shadow:0 0 0 1px rgba(83,252,24,.6);}

.modal-foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}
.modal-foot input[type=text]{ flex:1;min-width:180px;padding:12px 14px;border-radius:12px; border:1px solid var(--line);background:#0a120e;color:var(--text); font-family:inherit;font-size:14px;outline:none;}
.modal-foot input[type=text]:focus{border-color:var(--green)}

/* Busy + Toast */
.busy{ position:fixed;inset:0;z-index:200;display:none; align-items:center;justify-content:center;gap:14px;flex-direction:column; background:rgba(3,7,5,.85);backdrop-filter:blur(4px); font-size:14px;font-weight:700;color:var(--green);}
.busy.show{display:flex}
.spinner{ width:46px;height:46px;border-radius:50%; border:3px solid rgba(83,252,24,.15);border-top-color:var(--green); animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.toasts{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:10px}
.toast{ background:#10201a;border:1px solid var(--line);border-right:4px solid var(--green); color:var(--text);padding:12px 16px;border-radius:12px;font-size:13.5px; box-shadow:0 12px 30px rgba(0,0,0,.6);max-width:340px; animation:slideIn .25s ease;}
.toast.err{border-right-color:var(--danger)}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}

@media (max-width:900px){
  .stage{grid-template-columns:1fr}
  .chat-card{min-height:380px}
}
@media (max-width:560px){
  .logo{font-size:20px} .tagline{display:none}
  .searchbar input[type="text"]{min-width:100%}
  .btn{flex:1}
  .layout-toggles{width:100%; justify-content:space-between;}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">QORT</div>
    <div class="tagline">بثوث Kick المباشرة • تسجيل • كليبات</div>
  </div>
  <div class="rec-pill" id="recPill"><span class="dot"></span><span id="recPillText">غير مسجل</span></div>
</header>

<main class="wrap">
  <!-- شريط التحكم -->
  <section class="searchbar">
    <input type="text" id="channelName" placeholder="اكتب اسم القناة أو الصق رابط kick.com/...">
    <button class="btn primary" onclick="playChannel()">▶ تشغيل</button>
    <button class="btn ghost" onclick="addFavorite()">＋ مفضلة</button>
    
    <!-- أزرار تخطيط الشاشة (Multi-Stream) -->
    <div class="layout-toggles">
      <button class="layout-btn active" onclick="setLayout(1)">1 شاشة</button>
      <button class="layout-btn" onclick="setLayout(2)">2 شاشات</button>
      <button class="layout-btn" onclick="setLayout(4)">4 شاشات</button>
    </div>

    <button class="btn ghost" id="toggleChatBtn" onclick="toggleChat()">💬 إخفاء الشات</button>
    
    <!-- أزرار التسجيل و Auto-Clip -->
    <button class="btn rec" id="recBtn" onclick="toggleRecording()">● تسجيل</button>
    <button class="btn ghost" id="autoClipBtn" onclick="toggleAutoClip()">⏺ Auto-Clip (30s)</button>
    <button class="btn primary" id="saveAutoClipBtn" onclick="saveAutoClip()" style="display:none;">✂️ حفظ آخر 30s</button>
    
    <button class="btn ghost" onclick="document.getElementById('videoUpload').click()">⬆ رفع فيديو</button>
    <input type="file" id="videoUpload" accept="video/*" style="display:none;" onchange="handleVideoUpload(event)">
  </section>

  <!-- المشغل + الشات -->
  <section class="stage" id="stage">
    <div>
      <div class="video-grid layout-1" id="videoGrid">
        <!-- يتم توليد المشغلات هنا ديناميكياً -->
      </div>
      <div class="video-foot">
        <span id="nowPlaying">لم يتم اختيار قناة بعد</span>
        <span class="live" id="liveState"></span>
      </div>
    </div>
    <div class="chat-card" id="chatBox">
      <iframe id="chatPlayer" src="about:blank"></iframe>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>⭐ الستريمرز المفضلون</h2></div>
    <div class="streamer-grid" id="favoritesList"></div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>🔥 أشهر ستريمرز Kick</h2></div>
    <div class="streamer-grid" id="topList"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>🎞️ مكتبة الكليبات</h2>
      <span class="hint" id="clipsCount">0 كليب</span>
    </div>
    <div class="clips-grid" id="clipsGrid"></div>
  </section>
</main>

<!-- مودال محرر الكليب -->
<div class="modal" id="editorModal">
  <div class="modal-card">
    <div class="modal-head">
      <h3>✂️ إنشاء كليب</h3>
      <button class="icon-btn" onclick="closeEditor()">✕</button>
    </div>
    <video id="editorVideo" controls playsinline></video>
    <div class="trim-wrap">
      <div class="trim-track"><div class="trim-range" id="trimRange"></div></div>
      <div class="trim-row">
        <label>البداية</label>
        <input type="range" id="startRange" min="0" max="100" step="0.1" value="0">
        <output id="startVal">0:00</output>
      </div>
      <div class="trim-row">
        <label>النهاية</label>
        <input type="range" id="endRange" min="0" max="100" step="0.1" value="100">
        <output id="endVal">0:00</output>
      </div>
    </div>
    <div class="modal-foot">
      <input type="text" id="clipName" placeholder="اسم الكليب (اختياري)">
      <button class="btn ghost" onclick="previewSegment()">▶ معاينة</button>
      <button class="btn primary" onclick="saveClip(false)">💾 حفظ في المكتبة</button>
      <button class="btn ghost" onclick="saveClip(true)">⬇ تحميل</button>
    </div>
  </div>
</div>

<!-- مودال مشاهدة كليب -->
<div class="modal" id="viewModal">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="viewTitle">كليب</h3>
      <button class="icon-btn" onclick="closeView()">✕</button>
    </div>
    <video id="viewVideo" controls playsinline></video>
    <div class="modal-foot">
      <button class="btn primary" onclick="downloadViewed()">⬇ تحميل الكليب</button>
      <button class="btn ghost" onclick="closeView()">إغلاق</button>
    </div>
  </div>
</div>

<div class="busy" id="busy">
  <div class="spinner"></div>
  <span id="busyText">جاري المعالجة...</span>
</div>

<div class="toasts" id="toasts"></div>

<script>
// إعداد PWA (Service Worker بسيط جداً لتفعيل التثبيت)
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('data:text/javascript,self.addEventListener("fetch",e=>{})').catch(()=>{});
}

const topStreamers = ["Fahad", "SXB", "xEiD", "ABOKYAN", "xQc", "AdinRoss", "Amouranth", "Hikaru", "WestCOL", "bo3of", "oPiiLz", "abuswe7l"];
let isChatVisible = true;
let currentLayout = 1;
let activeChannels = [];

document.addEventListener("DOMContentLoaded", () => {
  initLayout();
  renderFavorites(); renderTopList(); renderClips();
});

function toast(msg, type = "ok") {
  const el = document.createElement("div");
  el.className = "toast" + (type === "err" ? " err" : "");
  el.textContent = msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => {
    el.style.transition = ".3s"; el.style.opacity = "0"; el.style.transform = "translateX(-20px)";
    setTimeout(() => el.remove(), 320);
  }, 3500);
}

// --- 1. تعدد الشاشات (Multi-Stream) ---
function setLayout(num) {
  currentLayout = num;
  document.querySelectorAll('.layout-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelector(`.layout-btn[onclick="setLayout(${num})"]`).classList.add('active');
  initLayout();
}

function initLayout() {
  const grid = document.getElementById("videoGrid");
  grid.className = `video-grid layout-${currentLayout}`;
  grid.innerHTML = "";
  
  // إعادة تعيين القنوات النشطة إذا قل العدد
  if (activeChannels.length > currentLayout) activeChannels = activeChannels.slice(0, currentLayout);

  for (let i = 0; i < currentLayout; i++) {
    const slot = document.createElement("div");
    slot.className = "video-slot";
    slot.innerHTML = `<iframe src="${activeChannels[i] ? 'https://player.kick.com/' + activeChannels[i] : 'about:blank'}" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>`;
    grid.appendChild(slot);
  }
  updateChatFrame();
}

function playChannel() {
  const raw = document.getElementById("channelName").value.trim();
  if (!raw) return toast("يرجى إدخال اسم القناة!", "err");
  loadStream(raw);
}

function loadStream(channel) {
  const name = cleanChannel(channel);
  if (!name) return toast("اسم القناة غير صالح", "err");
  
  // إضافة القناة للشاشة الأولى أو للشاشة الفارغة
  if (activeChannels.length < currentLayout) {
    activeChannels.push(name);
  } else {
    activeChannels[0] = name; // استبدال الشاشة الأولى
  }
  
  // تحديث الـ iframes
  const iframes = document.querySelectorAll("#videoGrid iframe");
  activeChannels.forEach((ch, i) => {
    if (iframes[i]) iframes[i].src = `https://player.kick.com/${ch}`;
  });

  document.getElementById("nowPlaying").innerHTML = `تشغيل: <span style="color:#53fc18;font-weight:800">${activeChannels.join(" | ")}</span>`;
  document.getElementById("liveState").textContent = "● LIVE";
  updateChatFrame();
}

function updateChatFrame() {
  if (activeChannels.length > 0) {
    document.getElementById("chatPlayer").src = `https://kick.com/popout/${activeChannels[0]}/chat`;
  } else {
    document.getElementById("chatPlayer").src = `about:blank`;
  }
}

function toggleChat() {
  isChatVisible = !isChatVisible;
  document.getElementById("chatBox").style.display = isChatVisible ? "" : "none";
  document.getElementById("stage").classList.toggle("no-chat", !isChatVisible);
  document.getElementById("toggleChatBtn").textContent = isChatVisible ? "💬 إخفاء الشات" : "💬 إظهار الشات";
}

// --- 4. حالة الستريمر (Live Status) ---
async function checkLiveStatus(name) {
  try {
    // استخدام وكيل CORS لتجنب مشاكل المتصفح
    const res = await fetch(`https://api.allorigins.win/raw?url=https://kick.com/api/v2/channels/${name}`);
    const data = await res.json();
    return data.livestream !== null;
  } catch (e) {
    return false;
  }
}

async function updateLiveDots() {
  const allNames = [...new Set([...getFavorites(), ...topStreamers])];
  for (const name of allNames) {
    const isLive = await checkLiveStatus(name);
    const dots = document.querySelectorAll(`.live-dot[data-channel="${name}"]`);
    dots.forEach(dot => {
      if (isLive) dot.classList.add('on');
      else dot.classList.remove('on');
    });
  }
}

// --- 2. المفضلة ---
function getFavorites() {
  try { return JSON.parse(localStorage.getItem("qort_favorites")) || ["Fahad", "SXB", "xEiD"]; }
  catch { return ["Fahad", "SXB", "xEiD"]; }
}
function saveFavorites(f) { localStorage.setItem("qort_favorites", JSON.stringify(f)); }
function addFavorite() {
  let raw = document.getElementById("channelName").value.trim();
  if (!raw) return toast("اكتب اسم القناة أولاً!", "err");
  const name = cleanChannel(raw);
  const favs = getFavorites();
  if (favs.some(f => f.toLowerCase() === name.toLowerCase())) return toast("القناة موجودة بالفعل!", "err");
  favs.push(name); saveFavorites(favs); renderFavorites();
  toast(`تمت إضافة ${name} ⭐`);
}
function removeFavorite(name) {
  saveFavorites(getFavorites().filter(f => f.toLowerCase() !== name.toLowerCase()));
  renderFavorites(); toast(`تم حذف ${name}`);
}
function renderFavorites() {
  const c = document.getElementById("favoritesList");
  const favs = getFavorites();
  c.innerHTML = favs.length ? "" : `<div class="empty">لا يوجد ستريمرز مفضلون.</div>`;
  favs.forEach(name => {
    const d = document.createElement("div"); d.className = "streamer-item";
    d.innerHTML = `<button class="streamer-btn" onclick="selectStreamer('${esc(name)}')"><span class="live-dot" data-channel="${esc(name)}"></span>${esc(name)}</button>
                   <button class="remove-btn" onclick="removeFavorite('${esc(name)}')">✕</button>`;
    c.appendChild(d);
  });
  updateLiveDots();
}
function renderTopList() {
  const c = document.getElementById("topList"); c.innerHTML = "";
  topStreamers.forEach(name => {
    const d = document.createElement("div"); d.className = "streamer-item";
    d.innerHTML = `<button class="streamer-btn" onclick="selectStreamer('${esc(name)}')"><span class="live-dot" data-channel="${esc(name)}"></span>${esc(name)}</button>`;
    c.appendChild(d);
  });
  updateLiveDots();
}
function selectStreamer(name) {
  document.getElementById("channelName").value = name;
  loadStream(name);
}
function esc(s) { return String(s).replace(/'/g, "\\'").replace(/</g, "&lt;"); }
function cleanChannel(raw) { return raw.replace(/^https?:\/\/(www\.)?kick\.com\//i, "").replace(/^\/+/, "").replace(/\/.*$/, "").trim(); }

// --- 3. Auto-Clip (ShadowPlay) ---
let autoClipRecorder = null;
let autoClipChunks = [];
let isAutoClipping = false;

async function toggleAutoClip() {
  if (isAutoClipping) {
    // إيقاف
    isAutoClipping = false;
    if (autoClipRecorder && autoClipRecorder.state !== "inactive") autoClipRecorder.stop();
    if (autoClipStream) autoClipStream.getTracks().forEach(t => t.stop());
    document.getElementById("autoClipBtn").textContent = "⏺ Auto-Clip (30s)";
    document.getElementById("autoClipBtn").classList.remove("rec"); // تغيير اللون
    document.getElementById("saveAutoClipBtn").style.display = "none";
    toast("تم إيقاف التسجيل التلقائي.");
    return;
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    return toast("Auto-Clip غير مدعوم في متصفح الجوال. استخدم زر رفع فيديو.", "err");
  }

  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: 30, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: true
    });
    
    autoClipStream = stream;
    autoClipChunks = [];
    const mime = pickMime();
    autoClipRecorder = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 8_000_000 } : undefined);
    
    autoClipRecorder.ondataavailable = e => { 
      if (e.data && e.data.size) {
        autoClipChunks.push(e.data);
        // الاحتفاظ بآخر 6 مقاطع فقط (كل مقطع 5 ثواني = 30 ثانية)
        if (autoClipChunks.length > 6) autoClipChunks.shift();
      }
    };

    // تسجيل مقاطع كل 5 ثواني
    autoClipRecorder.start(5000);
    isAutoClipping = true;
    
    document.getElementById("autoClipBtn").textContent = "⏹ إيقاف Auto-Clip";
    document.getElementById("autoClipBtn").classList.add("rec");
    document.getElementById("saveAutoClipBtn").style.display = "inline-flex";
    
    toast("بدأ Auto-Clip — سيتم حفظ آخر 30 ثانية عند الضغط على الزر الأخضر.");
  } catch (err) {
    if (err.name !== "NotAllowedError") toast("تعذر بدء Auto-Clip", "err");
  }
}

let autoClipStream = null;
function saveAutoClip() {
  if (autoClipChunks.length === 0) return toast("لا يوجد فيديو محفوظ بعد، انتظر بضع ثوانٍ.", "err");
  const blob = new Blob(autoClipChunks, { type: autoClipRecorder.mimeType || "video/webm" });
  openEditor(blob);
}

// --- 5. التسجيل العادي (Normal Recording) ---
let mediaRecorder = null, recChunks = [], recStream = null, recTimerInt = null, recStartedAt = 0, lastRecordingDuration = 0, isRecording = false;

function pickMime() {
  const list = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm", "video/mp4"];
  if (!window.MediaRecorder) return "";
  return list.find(t => MediaRecorder.isTypeSupported(t)) || "";
}

function toggleRecording() {
  if (isRecording) stopRecording();
  else startRecording();
}

async function startRecording() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    return toast("التسجيل غير مدعوم في متصفح الجوال. يرجى استخدام زر (رفع فيديو).", "err");
  }

  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: 60, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    recStream = stream; recChunks = [];
    const mime = pickMime();
    mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 15_000_000 } : undefined);
    mediaRecorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
    mediaRecorder.onstop = handleRecordingStop;
    stream.getVideoTracks()[0].addEventListener("ended", () => { if (isRecording) stopRecording(); });
    
    mediaRecorder.start(250);
    isRecording = true; recStartedAt = Date.now(); lastRecordingDuration = 0;

    const btn = document.getElementById("recBtn");
    btn.classList.add("active"); btn.textContent = "■ إيقاف 00:00";
    document.getElementById("recPill").classList.add("on");
    document.getElementById("recPillText").textContent = "جاري التسجيل";

    recTimerInt = setInterval(() => {
      const s = Math.floor((Date.now() - recStartedAt) / 1000);
      lastRecordingDuration = s;
      btn.textContent = `■ إيقاف ${formatTime(s)}`;
      document.getElementById("recPillText").textContent = `تسجيل ${formatTime(s)}`;
    }, 500);
  } catch (err) {
    if (err && err.name !== "NotAllowedError") toast("تعذّر بدء التسجيل", "err");
  }
}

function stopRecording() {
  if (!isRecording) return;
  isRecording = false;
  clearInterval(recTimerInt);
  try { if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop(); } catch (e) {}
  if (recStream) recStream.getTracks().forEach(t => t.stop());
  
  const btn = document.getElementById("recBtn");
  btn.classList.remove("active"); btn.textContent = "● تسجيل";
  document.getElementById("recPill").classList.remove("on");
  document.getElementById("recPillText").textContent = "غير مسجل";
}

function handleRecordingStop() {
  const mime = (mediaRecorder && mediaRecorder.mimeType) || pickMime() || "video/webm";
  const blob = new Blob(recChunks, { type: mime });
  recChunks = [];
  if (blob.size < 2000) return toast("التسجيل فارغ!", "err");
  openEditor(blob);
}

function handleVideoUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  openEditor(file);
  e.target.value = '';
}

// --- 6. محرر الكليب (Clip Editor) ---
let editorBlob = null, editorUrl = null, editorDuration = 0, previewStopAt = null;

async function openEditor(blob) {
  editorBlob = blob;
  if (editorUrl) URL.revokeObjectURL(editorUrl);
  editorUrl = URL.createObjectURL(blob);
  const v = document.getElementById("editorVideo");
  v.src = editorUrl;
  
  await new Promise(res => { v.onloadedmetadata = res; v.onerror = res; });
  let dur = isFinite(v.duration) && v.duration > 0 ? v.duration : 0;
  if (!dur) dur = await probeDuration(v);
  if (!dur || !isFinite(dur)) dur = Math.max(lastRecordingDuration, 1);
  editorDuration = dur;

  const sR = document.getElementById("startRange"), eR = document.getElementById("endRange");
  sR.min = 0; sR.max = dur.toFixed(1); sR.value = 0;
  eR.min = 0; eR.max = dur.toFixed(1); eR.value = dur.toFixed(1);
  document.getElementById("clipName").value = "";
  updateTrimUI();
  document.getElementById("editorModal").classList.add("show");
}

function probeDuration(v) {
  return new Promise(resolve => {
    let done = false;
    const finish = d => { if (!done) { done = true; v.ontimeupdate = null; v.currentTime = 0; resolve(d); } };
    v.ontimeupdate = () => { if (isFinite(v.duration) && v.duration > 0) finish(v.duration); };
    try { v.currentTime = 1e6; } catch (e) { finish(0); }
    setTimeout(() => finish(isFinite(v.duration) ? v.duration : 0), 1600);
  });
}

function updateTrimUI() {
  const sR = document.getElementById("startRange"), eR = document.getElementById("endRange");
  let s = parseFloat(sR.value), e = parseFloat(eR.value);
  if (s > e - 0.3) { s = Math.max(0, e - 0.3); sR.value = s; }
  document.getElementById("startVal").textContent = formatTime(s);
  document.getElementById("endVal").textContent = formatTime(e);
  const bar = document.getElementById("trimRange"), total = editorDuration || 1;
  bar.style.right = (s / total * 100) + "%";
  bar.style.width = Math.max(0, ((e - s) / total * 100)) + "%";
}
document.getElementById("startRange").addEventListener("input", updateTrimUI);
document.getElementById("endRange").addEventListener("input", updateTrimUI);

function previewSegment() {
  const v = document.getElementById("editorVideo");
  const s = parseFloat(document.getElementById("startRange").value);
  const e = parseFloat(document.getElementById("endRange").value);
  previewStopAt = e; v.currentTime = s; v.play().catch(() => {});
  v.ontimeupdate = () => { if (previewStopAt !== null && v.currentTime >= previewStopAt) { v.pause(); previewStopAt = null; } };
}

function closeEditor() {
  const v = document.getElementById("editorVideo");
  v.pause(); v.removeAttribute("src"); v.load();
  document.getElementById("editorModal").classList.remove("show");
  if (editorUrl) { URL.revokeObjectURL(editorUrl); editorUrl = null; }
  editorBlob = null;
}

function trimBlob(blob, start, end) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(blob);
    const v = document.createElement("video");
    v.src = url; v.playsInline = true; v.muted = false;
    v.style.cssText = "position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:.01";
    document.body.appendChild(v);
    const cleanup = () => { try { v.pause(); } catch (e) {} URL.revokeObjectURL(url); v.remove(); };
    v.onerror = () => { cleanup(); reject(new Error("تعذّر قراءة الفيديو")); };
    v.onloadeddata = async () => {
      try {
        await new Promise(res => { v.onseeked = res; v.currentTime = start; setTimeout(res, 900); });
        const stream = v.captureStream ? v.captureStream() : (v.mozCaptureStream ? v.mozCaptureStream() : null);
        if (!stream) { cleanup(); return reject(new Error("المتصفح لا يدعم القص")); }
        const mime = pickMime();
        const rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 15_000_000 } : undefined);
        const chunks = [];
        rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
        rec.onstop = () => { cleanup(); resolve(new Blob(chunks, { type: rec.mimeType || mime || "video/webm" })); };
        rec.start(200);
        await v.play();
        const check = () => {
          if (v.currentTime >= end - 0.06 || v.ended) {
            v.removeEventListener("timeupdate", check);
            v.pause();
            setTimeout(() => { try { rec.stop(); } catch (e) {} }, 260);
          }
        };
        v.addEventListener("timeupdate", check);
      } catch (err) { cleanup(); reject(err); }
    };
  });
}

async function saveClip(shouldDownload) {
  if (!editorBlob) return;
  const s = parseFloat(document.getElementById("startRange").value);
  const e = parseFloat(document.getElementById("endRange").value);
  if (e - s < 0.3) return toast("المدة قصيرة جداً!", "err");
  
  const nameInput = document.getElementById("clipName").value.trim();
  const autoName = `كليب ${activeChannels[0] || "Kick"} — ${new Date().toLocaleString("ar-EG")}`;
  const name = (nameInput || autoName).slice(0, 80);

  showBusy("جاري معالجة الكليب...");
  try {
    const needTrim = s > 0.08 || Math.abs(e - editorDuration) > 0.35;
    const out = needTrim ? await trimBlob(editorBlob, s, e) : editorBlob;

    if (shouldDownload) {
      downloadBlob(out, safeFileName(name) + ".webm");
      toast("تم تحميل الكليب ⬇");
    } else {
      showBusy("جاري حفظ الكليب...");
      const thumb = await makeThumb(out);
      const clip = { id: (crypto.randomUUID ? crypto.randomUUID() : "c" + Date.now() + Math.random().toString(16).slice(2)), name, blob: out, thumb, duration: Math.round((e - s) * 10) / 10, size: out.size, createdAt: Date.now(), channel: activeChannels[0] || "" };
      await dbPut(clip);
      await renderClips();
      toast("تم حفظ الكليب في المكتبة 🎞️");
      closeEditor();
    }
  } catch (err) {
    console.error(err); toast("حدث خطأ أثناء معالجة الكليب", "err");
  } finally { hideBusy(); }
}

function safeFileName(n) { return n.replace(/[\\/:*?"<>|]/g, "-").slice(0, 60); }
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
async function makeThumb(blob) {
  try {
    const url = URL.createObjectURL(blob);
    const v = document.createElement("video"); v.src = url; v.muted = true; v.playsInline = true;
    await new Promise(r => { v.onloadeddata = r; v.onerror = r; setTimeout(r, 1500); });
    try { v.currentTime = Math.min(1, (v.duration || 2) / 2); } catch (e) {}
    await new Promise(r => { v.onseeked = r; setTimeout(r, 900); });
    const c = document.createElement("canvas"); c.width = 320; c.height = 180;
    c.getContext("2d").drawImage(v, 0, 0, 320, 180);
    const data = c.toDataURL("image/jpeg", 0.7); URL.revokeObjectURL(url); return data;
  } catch (e) { return ""; }
}

// --- 7. قاعدة البيانات (IndexedDB) ---
const DB_NAME = "qort_db", STORE = "clips";
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => { const db = req.result; if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: "id" }); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbPut(clip) { const db = await openDB(); return new Promise((res, rej) => { const tx = db.transaction(STORE, "readwrite"); tx.objectStore(STORE).put(clip); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function dbGetAll() { const db = await openDB(); return new Promise((res, rej) => { const tx = db.transaction(STORE, "readonly"); const rq = tx.objectStore(STORE).getAll(); rq.onsuccess = () => res(rq.result || []); rq.onerror = () => rej(rq.error); }); }
async function dbGet(id) { const db = await openDB(); return new Promise((res, rej) => { const tx = db.transaction(STORE, "readonly"); const rq = tx.objectStore(STORE).get(id); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }); }
async function dbDelete(id) { const db = await openDB(); return new Promise((res, rej) => { const tx = db.transaction(STORE, "readwrite"); tx.objectStore(STORE).delete(id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }

async function renderClips() {
  const grid = document.getElementById("clipsGrid"), counter = document.getElementById("clipsCount");
  let clips = [];
  try { clips = await dbGetAll(); } catch (e) { console.warn(e); }
  clips.sort((a, b) => b.createdAt - a.createdAt);
  counter.textContent = clips.length + " كليب";
  grid.innerHTML = clips.length ? "" : `<div class="empty">لا توجد كليبات بعد — سجل أو ارفع فيديو لإنشاء أول كليب 🎬</div>`;

  clips.forEach(c => {
    const card = document.createElement("article"); card.className = "clip-card";
    card.innerHTML = `
      <div class="clip-thumb" style="${c.thumb ? `background-image:url('${c.thumb}')` : ""}">
        <button class="play" onclick="openClip('${c.id}')">▶</button>
        <span class="clip-dur">${formatTime(c.duration)}</span>
      </div>
      <div class="clip-body">
        <div class="clip-name" title="${escapeHtml(c.name)}">${escapeHtml(c.name)}</div>
        <div class="clip-meta">${new Date(c.createdAt).toLocaleDateString("ar-EG")} • ${formatBytes(c.size)}</div>
        <div class="clip-actions">
          <button onclick="openClip('${c.id}')">▶ تشغيل</button>
          <button onclick="downloadClip('${c.id}')">⬇</button>
          <button class="danger" onclick="deleteClip('${c.id}')">🗑</button>
        </div>
      </div>`;
    grid.appendChild(card);
  });
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m])); }
let viewedClip = null, viewedUrl = null;
async function openClip(id) {
  const c = await dbGet(id);
  if (!c) return toast("لم يتم العثور على الكليب", "err");
  viewedClip = c;
  if (viewedUrl) URL.revokeObjectURL(viewedUrl);
  viewedUrl = URL.createObjectURL(c.blob);
  document.getElementById("viewTitle").textContent = c.name;
  document.getElementById("viewVideo").src = viewedUrl;
  document.getElementById("viewModal").classList.add("show");
}
function closeView() {
  const v = document.getElementById("viewVideo"); v.pause(); v.removeAttribute("src"); v.load();
  document.getElementById("viewModal").classList.remove("show");
  if (viewedUrl) { URL.revokeObjectURL(viewedUrl); viewedUrl = null; }
  viewedClip = null;
}
function downloadViewed() { if (viewedClip) downloadBlob(viewedClip.blob, safeFileName(viewedClip.name) + ".webm"); }
async function downloadClip(id) { const c = await dbGet(id); if (c) downloadBlob(c.blob, safeFileName(c.name) + ".webm"); }
async function deleteClip(id) {
  if (!confirm("هل تريد حذف هذا الكليب نهائياً؟")) return;
  await dbDelete(id); await renderClips(); toast("تم حذف الكليب 🗑");
}

// أدوات مساعدة
function formatTime(sec) { sec = Math.max(0, Math.round(sec || 0)); const m = Math.floor(sec / 60), s = sec % 60; return `${m}:${String(s).padStart(2, "0")}`; }
function formatBytes(b) { if (!b) return "0 KB"; if (b < 1048576) return (b / 1024).toFixed(0) + " KB"; return (b / 1048576).toFixed(1) + " MB"; }
function showBusy(text) { document.getElementById("busyText").textContent = text || "جاري المعالجة..."; document.getElementById("busy").classList.add("show"); }
function hideBusy() { document.getElementById("busy").classList.remove("show"); }

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (document.getElementById("editorModal").classList.contains("show")) closeEditor();
    if (document.getElementById("viewModal").classList.contains("show")) closeView();
  }
});
