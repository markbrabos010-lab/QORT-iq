<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QORT - بثوث Kick المباشرة</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b0e0f;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
        }
        h1 { color: #53fc18; margin-bottom: 15px; text-align: center; font-size: 22px; }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 1000px;
            flex-wrap: wrap;
        }
        input {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #53fc18;
            background: #192320;
            color: #fff;
            font-size: 16px;
        }
        button {
            padding: 12px 18px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .play-btn { background: #53fc18; color: #000; }
        .add-btn { background: #192320; color: #53fc18; border: 1px solid #53fc18; }
        .chat-toggle-btn { background: #1e2c24; color: #fff; border: 1px solid #36503c; }

        .main-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 1000px;
        }
        .player-wrapper {
            display: flex;
            gap: 15px;
            width: 100%;
            height: 500px;
        }
        .video-container {
            flex: 1;
            height: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            border: 1px solid #28382c;
        }
        .chat-container {
            width: 320px;
            height: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            border: 1px solid #28382c;
        }
        iframe { width: 100%; height: 100%; border: none; }

        .streamers-section {
            background: #131b18;
            border: 1px solid #28382c;
            border-radius: 12px;
            padding: 15px;
            margin-top: 10px;
        }
        .section-title {
            color: #53fc18;
            font-size: 18px;
            margin-bottom: 10px;
            border-bottom: 1px solid #28382c;
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .streamer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
        }
        
        .streamer-item {
            display: flex;
            align-items: center;
            background: #1e2c24;
            border: 1px solid #36503c;
            border-radius: 6px;
            overflow: hidden;
        }
        .streamer-btn {
            background: transparent;
            color: #fff;
            border: none;
            padding: 10px 8px;
            flex: 1;
            cursor: pointer;
            font-size: 13px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .streamer-btn:hover { background: #53fc18; color: #000; }
        .remove-btn {
            background: #3a1c1c;
            color: #ff4444;
            border: none;
            padding: 10px 8px;
            cursor: pointer;
            font-size: 12px;
        }
        .remove-btn:hover { background: #ff4444; color: #fff; }

        @media (max-width: 768px) {
            .player-wrapper { flex-direction: column; height: auto; }
            .video-container { height: 300px; }
            .chat-container { width: 100%; height: 400px; }
        }
    </style>
</head>
<body>

    <h1>🎬 مشاهدة بثوث Kick المباشرة</h1>

    <div class="controls">
        <input type="text" id="channelName" placeholder="اكتب اسم القناة..." />
        <button class="play-btn" onclick="playChannel()">تشغيل</button>
        <button class="add-btn" onclick="addFavorite()">➕ إضافة للمفضلة</button>
        <button class="chat-toggle-btn" id="toggleChatBtn" onclick="toggleChat()">💬 إخفاء الشات</button>
    </div>

    <div class="main-container">
        <div class="player-wrapper">
            <div class="video-container">
                <iframe id="player" src="about:blank" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
            </div>
            <div class="chat-container" id="chatBox">
                <iframe id="chatPlayer" src="about:blank"></iframe>
            </div>
        </div>

        <!-- قسم الستريمرز المفضلين المخزنين -->
        <div class="streamers-section">
            <div class="section-title">
                <span>⭐ الستريمرز المفضلون</span>
            </div>
            <div class="streamer-grid" id="favoritesList"></div>
        </div>

        <!-- قسم أشهر الستريمرز -->
        <div class="streamers-section">
            <div class="section-title">🔥 أشهر ستريمرز Kick</div>
            <div class="streamer-grid" id="topList"></div>
        </div>
    </div>

    <script>
        const topStreamers = [
            "Fahad", "SXB", "xEiD", "ABOKYAN", "xQc", "AdinRoss", 
            "Amouranth", "Hikaru", "WestCOL", "bo3of", "oPiiLz", "abuswe7l"
        ];

        let isChatVisible = true;

        // تحميل المفضلة عند فتح الصفحة
        document.addEventListener("DOMContentLoaded", () => {
            renderFavorites();
            renderTopList();
        });

        function playChannel() {
            let channel = document.getElementById('channelName').value.trim();
            if(!channel) return alert("يرجى إدخال اسم القناة!");
            loadStream(channel);
        }

        function loadStream(channel) {
            channel = channel.replace("https://kick.com/", "").replace("/", "").trim();
            
            document.getElementById('player').src = `https://player.kick.com/${channel}`;
            document.getElementById('chatPlayer').src = `https://kick.com/popout/${channel}/chat`;
        }

        function toggleChat() {
            const chatBox = document.getElementById('chatBox');
            const toggleBtn = document.getElementById('toggleChatBtn');
            if (isChatVisible) {
                chatBox.style.display = 'none';
                toggleBtn.innerText = '💬 إظهار الشات';
                isChatVisible = false;
            } else {
                chatBox.style.display = 'block';
                toggleBtn.innerText = '💬 إخفاء الشات';
                isChatVisible = true;
            }
        }

        // --- إدارة الستريمرز المفضلين (localStorage) ---
        function getFavorites() {
            return JSON.parse(localStorage.getItem("qort_favorites")) || ["Fahad", "SXB", "xEiD"];
        }

        function saveFavorites(favs) {
            localStorage.setItem("qort_favorites", JSON.stringify(favs));
        }

        function addFavorite() {
            let name = document.getElementById('channelName').value.trim();
            if (!name) return alert("اكتب اسم القناة أولاً لإضافتها للمفضلة!");
            
            name = name.replace("https://kick.com/", "").replace("/", "").trim();
            let favs = getFavorites();

            if (favs.map(f => f.toLowerCase()).includes(name.toLowerCase())) {
                return alert("القناة موجودة بالفعل في المفضلة!");
            }

            favs.push(name);
            saveFavorites(favs);
            renderFavorites();
        }

        function removeFavorite(name) {
            let favs = getFavorites();
            favs = favs.filter(item => item.toLowerCase() !== name.toLowerCase());
            saveFavorites(favs);
            renderFavorites();
        }

        function renderFavorites() {
            const container = document.getElementById('favoritesList');
            container.innerHTML = "";
            const favs = getFavorites();

            if (favs.length === 0) {
                container.innerHTML = `<div style="color: #666; font-size: 13px;">لا يوجد ستريمرز مفضلون حتى الآن.</div>`;
                return;
            }

            favs.forEach(name => {
                const div = document.createElement('div');
                div.className = 'streamer-item';
                div.innerHTML = `
                    <button class="streamer-btn" onclick="selectStreamer('${name}')">${name}</button>
                    <button class="remove-btn" onclick="removeFavorite('${name}')">✕</button>
                `;
                container.appendChild(div);
            });
        }

        function renderTopList() {
            const container = document.getElementById('topList');
            container.innerHTML = "";
            topStreamers.forEach(name => {
                const div = document.createElement('div');
                div.className = 'streamer-item';
                div.innerHTML = `<button class="streamer-btn" onclick="selectStreamer('${name}')">${name}</button>`;
                container.appendChild(div);
            });
        }

        function selectStreamer(name) {
            document.getElementById('channelName').value = name;
            loadStream(name);
        }
    </script>

</body>
</html>
