<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهدة بثوث Kick بدون VPN</title>
    <!-- مكتبة HLS.js لتشغيل البثوث المباشرة -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            background-color: #0b0e0f;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 { color: #53fc18; margin-bottom: 20px; text-align: center; }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #53fc18;
            background: #192320;
            color: #fff;
            font-size: 16px;
        }
        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            background: #53fc18;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .video-container {
            width: 100%;
            max-width: 900px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        video { width: 100%; height: auto; display: block; }
    </style>
</head>
<body>

    <h1>🎬 مشاهدة بثوث Kick بدون VPN</h1>

    <div class="controls">
        <input type="text" id="streamUrl" placeholder="ضع رابط البث المباشر (.m3u8)..." />
        <button onclick="playStream()">تشغيل</button>
    </div>

    <div class="video-container">
        <video id="video" controls autoplay></video>
    </div>

    <script>
        // رابط الـ Cloudflare Worker الخاص بك
        const PROXY_WORKER = "https://sweet-tooth-0a92.markbrabos010.workers.dev/?url=";

        function playStream() {
            const rawUrl = document.getElementById('streamUrl').value.trim();
            if(!rawUrl) return alert("يرجى إدخال رابط البث المباشر (.m3u8) أولاً!");

            const proxiedUrl = PROXY_WORKER + encodeURIComponent(rawUrl);
            const video = document.getElementById('video');

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(proxiedUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = proxiedUrl;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }
        }
    </script>

</body>
</html>
