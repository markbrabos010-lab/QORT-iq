<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QORT - بثوث وتسجيلات Kick</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b0e0f;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
        }
        h1 { color: #53fc18; margin-bottom: 15px; text-align: center; font-size: 22px; }
        
        .search-box {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 15px;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #53fc18;
            background: #192320;
            color: #fff;
            font-size: 15px;
        }
        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            background: #53fc18;
            color: #000;
        }

        .main-container {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 1000px;
            height: 520px;
        }
        .video-container {
            flex: 2;
            height: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #28382c;
        }
        iframe { width: 100%; height: 100%; border: none; }

        /* منطقة تحكم وتصفح البثوث المسجلة */
        .vods-container {
            flex: 1;
            height: 100%;
            background: #131b18;
            border-radius: 12px;
            border: 1px solid #28382c;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .vods-header {
            color: #53fc18;
            font-weight: bold;
            font-size: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid #28382c;
        }
        .vod-input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .vod-input-group input {
            font-size: 13px;
            padding: 8px;
        }
        .vod-btn {
            background: #1e2c24;
            color: #53fc18;
            border: 1px solid #36503c;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
        }
        .vod-btn:hover { background: #25382e; }

        .links-box {
            margin-top: auto;
            background: #192320;
            border: 1px solid #36503c;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .links-box a {
            color: #53fc18;
            font-size: 13px;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .streamers-section {
            width: 100%;
            max-width: 1000px;
            margin-top: 15px;
            background: #131b18;
            border: 1px solid #28382c;
            border-radius: 12px;
            padding: 15px;
        }
        .streamer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
        .streamer-btn { background: #1e2c24; color: #fff; border: 1px solid #36503c; padding: 8px; border-radius: 6px; cursor: pointer; text-align: center; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; height: auto; }
            .video-container { height: 300px; }
            .vods-container { height: auto; }
        }
    </style>
</head>
<body>

    <h1>🎬 QORT - مشاهدة وتحميل بثوث Kick</h1>

    <div class="search-box">
        <input type="text" id="channelInput" placeholder="أدخل اسم الستريمر (مثل: Fahad)..." value="Fahad" />
        <button onclick="loadChannelData()">تشغيل البث المباشر</button>
    </div>

    <div class="main-container">
        <!-- شاشة المشغل الرئيسي -->
        <div class="video-container">
            <iframe id="mainPlayer" src="https://player.kick.com/Fahad" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        </div>

        <!-- أداة البثوث المسجلة والتحميل -->
        <div class="vods-container">
            <div class="vods-header" id="vodsTitle">📁 البثوث المسجلة (VODs)</div>
            
            <div class="vod-input-group">
                <label style="font-size: 12px; color: #aaa;">ضع رابط البث المسجل لتشغيله أو تنزيله:</label>
                <input type="text" id="vodUrlInput" placeholder="https://kick.com/fahad/videos/..." />
                <button class="vod-btn" onclick="playVodFromUrl()">▶️ تشغيل البث المسجل</button>
            </div>

            <div class="links-box">
                <a id="openChannelVods" href="https://kick.com/Fahad/videos" target="_blank">🌐 تصفح كل بثوث القناة على Kick</a>
                <a id="downloadVodBtn" href="https://kicklet.app/vod-downloader" target="_blank">⬇️ أداة تنزيل الفيديو المباشر (MP4)</a>
                <button onclick="copyCurrentLink()" style="background: #36503c; color: #fff; border: none; padding: 6px; border-radius: 4px; font-size: 12px; cursor: pointer; margin-top: 5px;">📋 نسخ رابط البث المعروض</button>
            </div>
        </div>
    </div>

    <div class="streamers-section">
        <div style="color: #53fc18; margin-bottom: 10px; font-weight: bold;">اختر ستريمر سريع:</div>
        <div class="streamer-grid" id="fastList"></div>
    </div>

    <script>
        const streamers = ["ABOKYAN", "Basamlv", "s6mito", "DrFx", "brof2", "Fahad", "xEiD", "SXB", "xQc", "AdinRoss"];
        let activeChannel = "Fahad";
        let activeVideoId = "";

        // إنشاء أزرار الستريمرز
        const fastListContainer = document.getElementById('fastList');
        streamers.forEach(name => {
            const btn = document.createElement('button');
            btn.className = 'streamer-btn';
            btn.innerText = name;
            btn.onclick = () => {
                document.getElementById('channelInput').value = name;
                loadChannelData();
            };
            fastListContainer.appendChild(btn);
        });

        function loadChannelData() {
            let channel = document.getElementById('channelInput').value.trim();
            if (!channel) return alert("يرجى إدخال اسم الستريمر!");

            activeChannel = channel.replace("https://kick.com/", "").replace("/", "").trim();

            // 1. تشغيل البث المباشر
            document.getElementById('mainPlayer').src = `https://player.kick.com/${activeChannel}`;
            document.getElementById('vodsTitle').innerText = `📁 بثوث ${activeChannel}`;
            
            // 2. تحديث روابط التصفح والقناة
            document.getElementById('openChannelVods').href = `https://kick.com/${activeChannel}/videos`;
            activeVideoId = "";
        }

        function playVodFromUrl() {
            let url = document.getElementById('vodUrlInput').value.trim();
            if (!url) return alert("يرجى إدخال رابط البث المسجل أولاً!");

            // استخراج Video ID من الرابط
            let videoId = url.split('/videos/')[1] || url.split('/video/')[1];
            if (videoId) {
                activeVideoId = videoId;
                // تشغيل الفيديو المسجل على الشاشة
                document.getElementById('mainPlayer').src = `https://player.kick.com/video/${videoId}`;
                alert("تم تشغيل البث المسجل بنجاح!");
            } else {
                alert("يرجى التأكد من أن الرابط يحتوي على كلمة /videos/");
            }
        }

        function copyCurrentLink() {
            let linkToCopy = activeVideoId 
                ? `https://kick.com/video/${activeVideoId}` 
                : `https://kick.com/${activeChannel}`;
                
            navigator.clipboard.writeText(linkToCopy);
            alert("تم نسخ الرابط بنجاح: " + linkToCopy);
        }
    </script>
</body>
</html>
