<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QORT - بثوث Mystery Town</title>
    <style>
        body {
            background-color: #0b0e0f;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
        }
        h1 { color: #53fc18; margin-bottom: 15px; text-align: center; font-size: 22px; }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 900px;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #53fc18;
            background: #192320;
            color: #fff;
            font-size: 16px;
        }
        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            background: #53fc18;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 900px;
        }
        .video-container {
            width: 100%;
            height: 450px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        iframe { width: 100%; height: 100%; border: none; }
        
        .streamers-section {
            background: #131b18;
            border: 1px solid #28382c;
            border-radius: 12px;
            padding: 15px;
        }
        .streamers-section h2 {
            color: #53fc18;
            margin-top: 0;
            font-size: 18px;
            border-bottom: 1px solid #28382c;
            padding-bottom: 8px;
        }
        .streamer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
        }
        .streamer-btn {
            background: #1e2c24;
            color: #fff;
            border: 1px solid #36503c;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .streamer-btn:hover {
            background: #53fc18;
            color: #000;
        }
    </style>
</head>
<body>

    <h1>🎬 مشاهدة بثوث Kick (Mystery Town)</h1>

    <div class="controls">
        <input type="text" id="channelName" placeholder="اكتب اسم القناة..." />
        <button onclick="playChannel()">تشغيل</button>
    </div>

    <div class="main-container">
        <div class="video-container">
            <iframe id="player" src="" allowfullscreen></iframe>
        </div>

        <div class="streamers-section">
            <h2>قائمة ستريمرز Mystery Town (mt)</h2>
            <div class="streamer-grid" id="streamerList"></div>
        </div>
    </div>

    <script>
        const PROXY_WORKER = "https://sweet-tooth-0a92.markbrabos010.workers.dev/?url=";

        const mtStreamers = [
            "ABOKYAN", "Basamlv", "s6mito", "DrFx", "brof2", "Fahad", "Firas", 
            "xEiD", "i3SW", "Majah92", "xlxwi", "OSAMAH", "AbuSwe7l", "tmnaa", 
            "Vilon", "Azzz", "Abunoo7", "Muvxn", "SXB", "RpWy", "ALKRKY99", 
            "vFernando", "JASER", "MortadaRadawy", "AhmedNemesis", "oPiiLz"
        ];

        // بناء قائمة الأزرار تلقائياً
        const listContainer = document.getElementById('streamerList');
        mtStreamers.forEach(name => {
            const btn = document.createElement('button');
            btn.className = 'streamer-btn';
            btn.innerText = name;
            btn.onclick = () => {
                document.getElementById('channelName').value = name;
                loadStream(name);
            };
            listContainer.appendChild(btn);
        });

        function playChannel() {
            let channel = document.getElementById('channelName').value.trim();
            if(!channel) return alert("يرجى إدخال اسم القناة أو اختيارها من القائمة!");
            loadStream(channel);
        }

        function loadStream(channel) {
            channel = channel.replace("https://kick.com/", "").replace("/", "");
            const targetEmbedUrl = `https://player.kick.com/${channel}`;
            document.getElementById('player').src = PROXY_WORKER + encodeURIComponent(targetEmbedUrl);
        }
    </script>

</body>
</html>
