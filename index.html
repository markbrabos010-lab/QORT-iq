<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QORT - مكتبة بثوث Kick</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b0e0f;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
        }
        h1 { color: #53fc18; margin-bottom: 15px; text-align: center; font-size: 22px; }
        
        .search-box {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 15px;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #53fc18;
            background: #192320;
            color: #fff;
            font-size: 16px;
        }
        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            background: #53fc18;
            color: #000;
        }

        .main-container {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 1000px;
            height: 520px;
        }
        .video-container {
            flex: 2;
            height: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #28382c;
            display: flex;
            flex-direction: column;
        }
        iframe { width: 100%; height: 100%; border: none; }

        /* قائمة البثوث المسجلة */
        .vods-container {
            flex: 1;
            height: 100%;
            background: #131b18;
            border-radius: 12px;
            border: 1px solid #28382c;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }
        .vods-header {
            color: #53fc18;
            font-weight: bold;
            font-size: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid #28382c;
            margin-bottom: 10px;
        }
        .vods-list {
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .vod-card {
            background: #1e2c24;
            border: 1px solid #36503c;
            border-radius: 8px;
            padding: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .vod-card:hover { border-color: #53fc18; background: #25382e; }
        .vod-title { font-size: 13px; font-weight: bold; color: #fff; margin-bottom: 5px; }
        .vod-meta { font-size: 11px; color: #888; display: flex; justify-content: space-between; }

        /* منطقة خيارات التنزيل والرابط */
        .download-bar {
            background: #131b18;
            border: 1px solid #53fc18;
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            width: 100%;
            max-width: 1000px;
            display: none;
            justify-content: space-between;
            align-items: center;
        }
        .download-bar a { color: #53fc18; font-weight: bold; text-decoration: none; }

        .streamers-section {
            width: 100%;
            max-width: 1000px;
            margin-top: 15px;
            background: #131b18;
            border: 1px solid #28382c;
            border-radius: 12px;
            padding: 15px;
        }
        .streamer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
        .streamer-btn { background: #1e2c24; color: #fff; border: 1px solid #36503c; padding: 8px; border-radius: 6px; cursor: pointer; text-align: center; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; height: auto; }
            .video-container { height: 300px; }
            .vods-container { height: 300px; }
        }
    </style>
</head>
<body>

    <h1>🎬 QORT - شاشة البث المباشر وبثوث الستريمر</h1>

    <div class="search-box">
        <input type="text" id="channelInput" placeholder="أدخل اسم الستريمر/اليوتيوبر..." />
        <button onclick="loadChannelData()">جلب البثوث</button>
    </div>

    <div class="main-container">
        <!-- شاشة المشغل الرئيسي -->
        <div class="video-container">
            <iframe id="mainPlayer" src="about:blank" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        </div>

        <!-- قائمة البثوث المسجلة (VODs) -->
        <div class="vods-container">
            <div class="vods-header" id="vodsTitle">📁 البثوث المسجلة</div>
            <div class="vods-list" id="vodsList">
                <div style="color: #666; text-align: center; font-size: 13px; margin-top: 20px;">اختر أو ابحث عن ستريمر لعرض جميع بثوثه المسجلة هنا</div>
            </div>
        </div>
    </div>

    <!-- شريط الرابط والتنزيل المباشر للبث المحدد -->
    <div class="download-bar" id="downloadBar">
        <span id="selectedVodText" style="font-size: 13px;"></span>
        <div>
            <button onclick="copyVodLink()" style="padding: 6px 12px; font-size: 12px; background: #36503c; color: #fff;">📋 نسخ الرابط</button>
            <a id="downloadBtn" href="#" target="_blank" style="margin-right: 10px;">⬇️ تنزيل البث (MP4)</a>
        </div>
    </div>

    <div class="streamers-section">
        <div style="color: #53fc18; margin-bottom: 10px; font-weight: bold;">اختر ستريمر سريع:</div>
        <div class="streamer-grid" id="fastList"></div>
    </div>

    <script>
        const WORKER_URL = "https://sweet-tooth-0a92.markbrabos010.workers.dev/";
        const streamers = ["ABOKYAN", "Basamlv", "s6mito", "DrFx", "brof2", "Fahad", "xEiD", "SXB", "xQc", "AdinRoss"];
        let currentVodUrl = "";

        // إنشاء أزرار الاختيار السريع
        const fastListContainer = document.getElementById('fastList');
        streamers.forEach(name => {
            const btn = document.createElement('button');
            btn.className = 'streamer-btn';
            btn.innerText = name;
            btn.onclick = () => {
                document.getElementById('channelInput').value = name;
                loadChannelData();
            };
            fastListContainer.appendChild(btn);
        });

        async function loadChannelData() {
            let channel = document.getElementById('channelInput').value.trim();
            if (!channel) return alert("يرجى إدخال اسم الستريمر!");

            channel = channel.replace("https://kick.com/", "").replace("/", "").trim();

            // 1. تشغيل البث المباشر للقناة في الشاشة الرئيسية
            document.getElementById('mainPlayer').src = `https://player.kick.com/${channel}`;
            document.getElementById('vodsTitle').innerText = `📁 بثوث ${channel} المسجلة`;
            
            const vodsList = document.getElementById('vodsList');
            vodsList.innerHTML = `<div style="color: #888; text-align: center;">جاري جلب البثوث المسجلة...</div>`;

            try {
                // 2. جلب قائمة الفيديوهات المسجلة عبر الـ Worker الخاص بك
                const response = await fetch(`${WORKER_URL}?url=https://kick.com/api/v2/channels/${channel}/videos`);
                const videos = await response.json();

                vodsList.innerHTML = "";

                if (!videos || videos.length === 0) {
                    vodsList.innerHTML = `<div style="color: #888; text-align: center;">لا توجد بثوث مسجلة متاحة لهذا الستريمر.</div>`;
                    return;
                }

                // 3. عرض قائمة البثوث المسجلة
                videos.forEach((vod, index) => {
                    const vodCard = document.createElement('div');
                    vodCard.className = 'vod-card';
                    
                    const title = vod.session_title || `بث مسجل #${index + 1}`;
                    const date = vod.created_at ? vod.created_at.split('T')[0] : '';
                    const duration = vod.duration ? Math.round(vod.duration / 60000) + ' دقيقة' : '';
                    const vodVideoId = vod.video ? vod.video.uuid : (vod.id || '');

                    vodCard.innerHTML = `
                        <div class="vod-title">${title}</div>
                        <div class="vod-meta">
                            <span>📅 ${date}</span>
                            <span>⏱️️ ${duration}</span>
                        </div>
                    `;

                    vodCard.onclick = () => playVod(vodVideoId, title, channel);
                    vodsList.appendChild(vodCard);
                });

            } catch (err) {
                console.error(err);
                vodsList.innerHTML = `<div style="color: #ff4444; text-align: center;">عذراً، تعذر جلب قائمة البثوث المسجلة.</div>`;
            }
        }

        function playVod(videoId, title, channel) {
            if (!videoId) return alert("تعذر العثور على معرف هذا الفيديو!");

            // 1. تشغيل الفيديو المحدد داخل الشاشة
            document.getElementById('mainPlayer').src = `https://player.kick.com/video/${videoId}`;

            // 2. تجهيز روابط التحميل والنسخ
            currentVodUrl = `https://kick.com/${channel}/videos/${videoId}`;
            
            document.getElementById('selectedVodText').innerText = `🎬 المحدد: ${title}`;
            document.getElementById('downloadBtn').href = `https://kicklet.app/vod-downloader`;
            document.getElementById('downloadBar').style.display = 'flex';
        }

        function copyVodLink() {
            if (!currentVodUrl) return;
            navigator.clipboard.writeText(currentVodUrl);
            alert("تم نسخ رابط البث المسجل بنجاح!");
        }
    </script>
</body>
</html>
