<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>محرر الكليبات</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b23; --panel2:#1e242e; --line:#2a323e;
    --txt:#e6ebf2; --muted:#8b97a8; --acc:#3b82f6; --acc2:#22c55e; --danger:#ef4444;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:"Segoe UI",Tahoma,system-ui,sans-serif;
    background:var(--bg); color:var(--txt); height:100vh; display:flex; flex-direction:column;
  }
  header{
    display:flex; align-items:center; gap:14px; padding:12px 18px;
    background:var(--panel); border-bottom:1px solid var(--line);
  }
  header h1{font-size:17px; margin:0; font-weight:700}
  header .total{margin-inline-start:auto; color:var(--muted); font-size:13px}
  main{flex:1; display:flex; min-height:0}

  /* اللوحة الجانبية */
  .panel{
    width:330px; background:var(--panel); border-inline-start:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0;
  }
  .filebtn{
    display:block; text-align:center; margin:14px; padding:12px;
    background:var(--acc); color:#fff; border-radius:10px; cursor:pointer;
    font-weight:600; font-size:14px; transition:.2s;
  }
  .filebtn:hover{filter:brightness(1.1)}
  #list{flex:1; overflow-y:auto; padding:0 12px 12px}
  .empty{color:var(--muted); text-align:center; font-size:13px; margin-top:40px}

  .clip{
    background:var(--panel2); border:1px solid var(--line); border-radius:10px;
    padding:10px; margin-bottom:10px;
  }
  .clip-top{display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .idx{
    background:var(--acc); color:#fff; width:20px; height:20px; border-radius:6px;
    display:grid; place-items:center; font-size:11px; font-weight:700; flex:none;
  }
  .nm{font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#c9d4e2}
  .clip-mid{display:flex; gap:8px}
  .clip-mid label{flex:1; font-size:11px; color:var(--muted); display:flex; flex-direction:column; gap:3px}
  .clip-mid input{
    background:#0d1117; border:1px solid var(--line); color:var(--txt);
    border-radius:6px; padding:5px 7px; font-size:12px; width:100%;
  }
  .clip-bot{display:flex; align-items:center; justify-content:space-between; margin-top:9px}
  .dur{font-size:11px; color:var(--muted)}
  .acts{display:flex; gap:5px}
  .acts button{
    background:#0d1117; border:1px solid var(--line); color:var(--txt);
    border-radius:6px; padding:3px 8px; cursor:pointer; font-size:11px;
  }
  .acts button:hover:not(:disabled){background:#28313d}
  .acts button:disabled{opacity:.3; cursor:default}
  .acts [data-act="del"]:hover{background:var(--danger); border-color:var(--danger)}

  /* المسرح */
  .stage{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
         padding:20px; gap:14px; min-width:0}
  canvas{
    background:#000; border-radius:12px; max-width:100%; max-height:calc(100vh - 180px);
    box-shadow:0 10px 40px rgba(0,0,0,.5);
  }
  .controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center}
  .controls button{
    background:var(--panel2); color:var(--txt); border:1px solid var(--line);
    border-radius:9px; padding:10px 20px; font-size:14px; font-weight:600; cursor:pointer;
    transition:.2s;
  }
  .controls button:hover:not(:disabled){background:#28313d}
  .controls button:disabled{opacity:.45; cursor:not-allowed}
  #exportBtn{background:var(--acc2); border-color:var(--acc2); color:#06210f}
  #exportBtn:hover:not(:disabled){filter:brightness(1.08)}
  #status{font-size:13px; color:var(--muted); min-width:120px}
</style>
</head>
<body>

<header>
  <h1>🎬 محرر الكليبات</h1>
  <span class="total" id="totalDur">المدة: 0.0 ث</span>
</header>

<main>
  <section class="stage">
    <canvas id="preview" width="960" height="540"></canvas>
    <div class="controls">
      <button id="playBtn" disabled>▶ معاينة</button>
      <button id="exportBtn" disabled>⬇ تصدير WEBM</button>
      <span id="status"></span>
    </div>
  </section>

  <aside class="panel">
    <label class="filebtn">
      ➕ إضافة كليبات
      <input type="file" id="fileInput" accept="video/*" multiple hidden>
    </label>
    <div id="list"><p class="empty">لا توجد كليبات بعد</p></div>
  </aside>
</main>

<script>
/* ================= الحالة ================= */
const clips = [];
let previewing = false;
let busy = false;

const canvas   = document.getElementById('preview');
const ctx      = canvas.getContext('2d');
const listEl   = document.getElementById('list');
const statusEl = document.getElementById('status');
const playBtn  = document.getElementById('playBtn');
const exportBtn= document.getElementById('exportBtn');
const totalEl  = document.getElementById('totalDur');
const fileInput= document.getElementById('fileInput');

const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const esc   = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= إضافة الكليبات ================= */
fileInput.addEventListener('change', e=>{
  [...e.target.files].forEach(addClip);
  e.target.value = '';
});

function addClip(file){
  const url = URL.createObjectURL(file);
  const el  = document.createElement('video');
  el.src = url; el.preload = 'auto'; el.playsInline = true;

  el.addEventListener('loadedmetadata', ()=>{
    clips.push({
      name: file.name,
      el,
      duration: el.duration,
      start: 0,
      end: el.duration
    });
    refresh();
    if(clips.length === 1) showFirstFrame(clips[0]);
  }, {once:true});
}

/* رسم أول فريم كمعاينة */
function showFirstFrame(c){
  const done = ()=>{ drawVideo(c.el); };
  if(c.el.readyState >= 2) done();
  else c.el.addEventListener('loadeddata', done, {once:true});
}

/* ================= واجهة القائمة ================= */
function refresh(){
  totalEl.textContent = 'المدة: ' + totalDuration().toFixed(1) + ' ث';
  playBtn.disabled   = clips.length === 0 || busy;
  exportBtn.disabled = clips.length === 0 || busy;

  listEl.innerHTML = '';
  if(!clips.length){
    listEl.innerHTML = '<p class="empty">لا توجد كليبات بعد</p>';
    return;
  }

  clips.forEach((c,i)=>{
    const card = document.createElement('div');
    card.className = 'clip';
    card.innerHTML = `
      <div class="clip-top">
        <span class="idx">${i+1}</span>
        <span class="nm" title="${esc(c.name)}">${esc(c.name)}</span>
      </div>
      <div class="clip-mid">
        <label>البداية
          <input type="number" class="in-start" min="0" max="${c.duration.toFixed(2)}" step="0.1" value="${c.start.toFixed(1)}">
        </label>
        <label>النهاية
          <input type="number" class="in-end" min="0" max="${c.duration.toFixed(2)}" step="0.1" value="${c.end.toFixed(1)}">
        </label>
      </div>
      <div class="clip-bot">
        <span class="dur">⏱ ${(c.end - c.start).toFixed(1)} ث</span>
        <span class="acts">
          <button data-act="up"   ${i===0?'disabled':''}>▲</button>
          <button data-act="down" ${i===clips.length-1?'disabled':''}>▼</button>
          <button data-act="del">🗑</button>
        </span>
      </div>`;

    const sIn = card.querySelector('.in-start');
    const eIn = card.querySelector('.in-end');
    const dur = card.querySelector('.dur');

    const sync = ()=>{
      sIn.value = c.start.toFixed(1);
      eIn.value = c.end.toFixed(1);
      dur.textContent = `⏱ ${(c.end - c.start).toFixed(1)} ث`;
      totalEl.textContent = 'المدة: ' + totalDuration().toFixed(1) + ' ث';
    };

    sIn.addEventListener('change', ()=>{
      let v = clamp(parseFloat(sIn.value) || 0, 0, c.duration);
      c.start = Math.min(v, c.end - 0.1);
      if(c.start < 0) c.start = 0;
      sync();
    });
    eIn.addEventListener('change', ()=>{
      let v = clamp(parseFloat(eIn.value) || 0, 0, c.duration);
      c.end = Math.max(v, c.start + 0.1);
      if(c.end > c.duration) c.end = c.duration;
      sync();
    });

    card.querySelector('[data-act="up"]').onclick = ()=>{
      if(i > 0){ [clips[i-1], clips[i]] = [clips[i], clips[i-1]]; refresh(); }
    };
    card.querySelector('[data-act="down"]').onclick = ()=>{
      if(i < clips.length-1){ [clips[i+1], clips[i]] = [clips[i], clips[i+1]]; refresh(); }
    };
    card.querySelector('[data-act="del"]').onclick = ()=>{
      URL.revokeObjectURL(c.el.src);
      clips.splice(i,1);
      refresh();
    };

    listEl.appendChild(card);
  });
}

const totalDuration = ()=> clips.reduce((s,c)=> s + Math.max(0, c.end - c.start), 0);

/* ================= الرسم على الكانفس ================= */
function drawVideo(v){
  const vw = v.videoWidth, vh = v.videoHeight;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if(!vw || !vh) return;
  const scale = Math.min(canvas.width / vw, canvas.height / vh);
  const w = vw * scale, h = vh * scale;
  ctx.drawImage(v, (canvas.width - w)/2, (canvas.height - h)/2, w, h);
}

function seekTo(el, t){
  return new Promise(res=>{
    if(Math.abs(el.currentTime - t) < 0.05){ el.currentTime = t; res(); return; }
    const h = ()=>{ el.removeEventListener('seeked', h); res(); };
    el.addEventListener('seeked', h);
    el.currentTime = t;
  });
}

/* ================= المعاينة ================= */
playBtn.addEventListener('click', async ()=>{
  if(previewing){ previewing = false; return; }   // إيقاف
  if(!clips.length) return;

  previewing = true;
  busy = true;
  playBtn.textContent = '⏸ إيقاف';
  exportBtn.disabled = true;
  statusEl.textContent = 'معاينة…';

  for(const c of clips){
    if(!previewing) break;
    const ok = await playClip(c);
    if(!ok) break;
  }

  clips.forEach(c=>c.el.pause());
  previewing = false;
  busy = false;
  playBtn.textContent = '▶ معاينة';
  exportBtn.disabled = false;
  statusEl.textContent = '';
});

function playClip(c){
  return new Promise(async res=>{
    await seekTo(c.el, c.start);
    c.el.muted = false;
    try{ await c.el.play(); }catch(e){ res(false); return; }

    const tick = ()=>{
      if(!previewing){ c.el.pause(); res(false); return; }
      if(c.el.currentTime >= c.end - 0.03 || c.el.ended){
        c.el.pause(); res(true); return;
      }
      drawVideo(c.el);
      requestAnimationFrame(tick);
    };
    tick();
  });
}

/* ================= التصدير ================= */
exportBtn.addEventListener('click', exportVideo);

async function exportVideo(){
  if(!clips.length || busy) return;
  busy = true;
  playBtn.disabled = true;
  exportBtn.disabled = true;

  try{
    /* 1) تجهيز الصوت (اختياري — لو فشل نكمل بدون صوت) */
    let audioTracks = [];
    let audioCtx = null;
    try{
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      await audioCtx.resume();
      const dest = audioCtx.createMediaStreamDestination();
      clips.forEach(c=>{
        if(!c._srcNode){
          c._srcNode = audioCtx.createMediaElementSource(c.el);
          c._srcNode.connect(audioCtx.destination); // نسمع الصوت أثناء التصدير
        }
        c._srcNode.connect(dest);
      });
      audioTracks = dest.stream.getAudioTracks();
    }catch(err){
      console.warn('تعذّر تجهيز الصوت:', err);
      audioCtx = null;
    }

    /* 2) بثّ الكانفس */
    const stream = canvas.captureStream(30);
    audioTracks.forEach(t=> stream.addTrack(t));

    const mime = [
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp8,opus',
      'video/webm'
    ].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';

    const rec = new MediaRecorder(stream, {
      mimeType: mime || undefined,
      videoBitsPerSecond: 6_000_000
    });

    const chunks = [];
    rec.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };
    const stopped = new Promise(r=> rec.onstop = r);

    rec.start(200);

    /* 3) تشغيل الكليبات بالترتيب مع الرسم */
    for(let i = 0; i < clips.length; i++){
      const c = clips[i];
      statusEl.textContent = `تصدير ${i+1}/${clips.length}…`;

      await seekTo(c.el, c.start);
      try{ await c.el.play(); }catch(e){ /* تجاهل */ }

      await new Promise(res=>{
        const tick = ()=>{
          if(c.el.currentTime >= c.end - 0.03 || c.el.ended){ res(); return; }
          drawVideo(c.el);
          requestAnimationFrame(tick);
        };
        tick();
      });

      c.el.pause();
    }

    await new Promise(r=> setTimeout(r, 250)); // التقاط آخر فريم
    rec.stop();
    await stopped;

    /* 4) التنزيل */
    const blob = new Blob(chunks, {type:'video/webm'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `montage-${Date.now()}.webm`;
    a.click();
    setTimeout(()=> URL.revokeObjectURL(a.href), 4000);

    statusEl.textContent = '✅ تم التصدير';
    if(audioCtx) await audioCtx.close().catch(()=>{});
  }catch(err){
    console.error(err);
    statusEl.textContent = '❌ حدث خطأ أثناء التصدير';
  }finally{
    busy = false;
    playBtn.disabled = clips.length === 0;
    exportBtn.disabled = clips.length === 0;
    setTimeout(()=>{ if(!busy) statusEl.textContent = ''; }, 3000);
  }
}

/* ================= بداية ================= */
ctx.fillStyle = '#000';
ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.fillStyle = '#556';
ctx.font = '22px sans-serif';
ctx.textAlign = 'center';
ctx.fillText('أضِف كليبات للبدء', canvas.width/2, canvas.height/2);
refresh();
</script>
</body>
</html>
