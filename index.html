<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QORT - بثوث Kick</title>
    <style>
        body {
            background-color: #0b0e0f;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
        }
        h1 { color: #53fc18; margin-bottom: 15px; text-align: center; font-size: 22px; }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 900px;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #53fc18;
            background: #192320;
            color: #fff;
            font-size: 16px;
        }
        button.play-btn {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            background: #53fc18;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 900px;
        }
        .video-container {
            width: 100%;
            height: 480px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        iframe { width: 100%; height: 100%; border: none; }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .tab-btn {
            padding: 8px 16px;
            background: #1e2c24;
            color: #fff;
            border: 1px solid #36503c;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .tab-btn.active {
            background: #53fc18;
            color: #000;
        }

        .streamers-section {
            background: #131b18;
            border: 1px solid #28382c;
            border-radius: 12px;
            padding: 15px;
        }
        .streamer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
        }
        .streamer-btn {
            background: #1e2c24;
            color: #fff;
            border: 1px solid #36503c;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .streamer-btn:hover {
            background: #53fc18;
            color: #000;
        }
    </style>
</head>
<body>

    <h1>🎬 مشاهدة بثوث Kick المباشرة</h1>

    <div class="controls">
        <input type="text" id="channelName" placeholder="اكتب اسم القناة..." />
        <button class="play-btn" onclick="playChannel()">تشغيل</button>
    </div>

    <div class="main-container">
        <div class="video-container">
            <iframe id="player" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        </div>

        <div class="streamers-section">
            <div class="tabs">
                <button class="tab-btn active" id="btn-mt" onclick="switchList('mt')">قائمة MT</button>
                <button class="tab-btn" id="btn-top20" onclick="switchList('top20')">Top 20 Kick</button>
            </div>
            <div class="streamer-grid" id="streamerList"></div>
        </div>
    </div>

    <script>
        const lists = {
            mt: [
                "ABOKYAN", "Basamlv", "s6mito", "DrFx", "brof2", "Fahad", "Firas", 
                "xEiD", "i3SW", "Majah92", "xlxwi", "OSAMAH", "AbuSwe7l", "tmnaa", 
                "Vilon", "Azzz", "Abunoo7", "Muvxn", "SXB", "RpWy", "ALKRKY99", 
                "vFernando", "JASER", "MortadaRadawy", "AhmedNemesis", "oPiiLz"
            ],
            top20: [
                "xQc", "AdinRoss", "Amouranth", "Hikaru", "WestCOL", "Davooxeneize",
                "absi", "SHERO", "bo3of", "oPiiLz", "abuswe7l", "3mr", "abu_abeer16",
                "firas", "SXB", "Azza", "trainwreckstv", "roshtein", "mizkif", "yassuo"
            ]
        };

        let currentTab = 'mt';

        function renderList(listKey) {
            const listContainer = document.getElementById('streamerList');
            listContainer.innerHTML = '';
            lists[listKey].forEach(name => {
                const btn = document.createElement('button');
                btn.className = 'streamer-btn';
                btn.innerText = name;
                btn.onclick = () => {
                    document.getElementById('channelName').value = name;
                    loadStream(name);
                };
                listContainer.appendChild(btn);
            });
        }

        function switchList(tabKey) {
            currentTab = tabKey;
            document.getElementById('btn-mt').classList.toggle('active', tabKey === 'mt');
            document.getElementById('btn-top20').classList.toggle('active', tabKey === 'top20');
            renderList(tabKey);
        }

        function playChannel() {
            let channel = document.getElementById('channelName').value.trim();
            if(!channel) return alert("يرجى إدخال اسم القناة أو اختيارها من القائمة!");
            loadStream(channel);
        }

        function loadStream(channel) {
            channel = channel.replace("https://kick.com/", "").replace("/", "");
            document.getElementById('player').src = `https://player.kick.com/${channel}`;
        }

        // التهيئة الأولية
        renderList('mt');
    </script>

</body>
</html>
