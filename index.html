<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QORT - بثوث و تسجيلات Kick</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b0e0f;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
        }
        h1 { color: #53fc18; margin-bottom: 15px; text-align: center; font-size: 22px; }
        
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tab-btn {
            background: #1e2c24;
            color: #fff;
            border: 1px solid #36503c;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .tab-btn.active {
            background: #53fc18;
            color: #000;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 1000px;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #53fc18;
            background: #192320;
            color: #fff;
            font-size: 16px;
        }
        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
        .action-btn { background: #53fc18; color: #000; }
        .chat-toggle-btn { background: #1e2c24; color: #53fc18; border: 1px solid #53fc18; }

        .main-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 1000px;
        }
        .player-wrapper {
            display: flex;
            gap: 15px;
            width: 100%;
            height: 500px;
        }
        .video-container {
            flex: 1;
            height: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #28382c;
        }
        .chat-container {
            width: 320px;
            height: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #28382c;
        }
        iframe { width: 100%; height: 100%; border: none; }

        .download-box {
            display: none;
            background: #131b18;
            border: 1px solid #53fc18;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .download-link {
            color: #53fc18;
            word-break: break-all;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }

        .streamers-section {
            background: #131b18;
            border: 1px solid #28382c;
            border-radius: 12px;
            padding: 15px;
        }
        .section-title { color: #53fc18; font-size: 18px; margin-bottom: 10px; border-bottom: 1px solid #28382c; padding-bottom: 5px; }
        .streamer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
        .streamer-btn { background: #1e2c24; color: #fff; border: 1px solid #36503c; padding: 10px; border-radius: 6px; cursor: pointer; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        @media (max-width: 768px) {
            .player-wrapper { flex-direction: column; height: auto; }
            .video-container { height: 300px; }
            .chat-container { width: 100%; height: 400px; }
        }
    </style>
</head>
<body>

    <h1>🎬 QORT - بثوث وتسجيلات Kick</h1>

    <div class="tab-buttons">
        <button class="tab-btn active" id="tabLive" onclick="switchMode('live')">🔴 البث المباشر</button>
        <button class="tab-btn" id="tabVod" onclick="switchMode('vod')">📁 جلب وتحميل بث مسجل (VOD)</button>
    </div>

    <!-- قسم البث المباشر -->
    <div id="liveControls" class="controls">
        <input type="text" id="channelName" placeholder="اكتب اسم القناة..." />
        <button class="action-btn" onclick="playChannel()">تشغيل</button>
        <button class="chat-toggle-btn" id="toggleChatBtn" onclick="toggleChat()">💬 إخفاء الشات</button>
    </div>

    <!-- قسم جلب الفيديو المسجل -->
    <div id="vodControls" class="controls" style="display: none;">
        <input type="text" id="vodUrl" placeholder="أدخل رابط البث المسجل (مثال: https://kick.com/xqc/videos/...)" />
        <button class="action-btn" onclick="fetchVod()">جلب وتحميل</button>
    </div>

    <div class="main-container">
        <div class="player-wrapper">
            <div class="video-container">
                <iframe id="player" src="about:blank" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
            </div>
            <div class="chat-container" id="chatBox">
                <iframe id="chatPlayer" src="about:blank"></iframe>
            </div>
        </div>

        <div id="downloadBox" class="download-box">
            <div style="color: #fff;">✅ تم جلب ملف البث بنجاح:</div>
            <a id="downloadBtn" href="#" target="_blank" class="download-link">⬇️ اضغط هنا لتنزيل الفيديو / فتح رابط الـ Stream Direct</a>
        </div>

        <div class="streamers-section" id="streamersSection">
            <div class="section-title">قائمة Mystery Town (mt)</div>
            <div class="streamer-grid" id="mtList"></div>

            <div class="section-title" style="margin-top: 15px;">أشهر ستريمرز Kick (Top 20)</div>
            <div class="streamer-grid" id="top20List"></div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://sweet-tooth-0a92.markbrabos010.workers.dev/";

        const mtStreamers = ["ABOKYAN", "Basamlv", "s6mito", "DrFx", "brof2", "Fahad", "Firas", "xEiD", "i3SW", "Majah92", "xlxwi", "OSAMAH", "AbuSwe7l", "tmnaa", "Vilon", "Azzz", "Abunoo7", "Muvxn", "SXB", "RpWy", "ALKRKY99", "vFernando", "JASER", "MortadaRadawy", "AhmedNemesis", "oPiiLz"];
        const top20Streamers = ["xQc", "AdinRoss", "Amouranth", "Hikaru", "WestCOL", "Davooxeneize", "absi", "SHERO", "bo3of", "oPiiLz", "abuswe7l", "3mr", "abu_abeer16", "firas", "SXB", "Azza", "trainwreckstv", "roshtein", "mizkif", "yassuo"];

        let currentMode = 'live';
        let isChatVisible = true;

        function switchMode(mode) {
            currentMode = mode;
            if (mode === 'live') {
                document.getElementById('tabLive').classList.add('active');
                document.getElementById('tabVod').classList.remove('active');
                document.getElementById('liveControls').style.display = 'flex';
                document.getElementById('vodControls').style.display = 'none';
                document.getElementById('chatBox').style.display = isChatVisible ? 'block' : 'none';
                document.getElementById('toggleChatBtn').style.display = 'inline-block';
                document.getElementById('streamersSection').style.display = 'block';
                document.getElementById('downloadBox').style.display = 'none';
            } else {
                document.getElementById('tabVod').classList.add('active');
                document.getElementById('tabLive').classList.remove('active');
                document.getElementById('vodControls').style.display = 'flex';
                document.getElementById('liveControls').style.display = 'none';
                document.getElementById('chatBox').style.display = 'none';
                document.getElementById('toggleChatBtn').style.display = 'none';
                document.getElementById('streamersSection').style.display = 'none';
            }
        }

        function createButtons(list, containerId) {
            const container = document.getElementById(containerId);
            list.forEach(name => {
                const btn = document.createElement('button');
                btn.className = 'streamer-btn';
                btn.innerText = name;
                btn.onclick = () => {
                    document.getElementById('channelName').value = name;
                    loadStream(name);
                };
                container.appendChild(btn);
            });
        }

        function playChannel() {
            let channel = document.getElementById('channelName').value.trim();
            if(!channel) return alert("يرجى إدخال اسم القناة!");
            loadStream(channel);
        }

        function loadStream(channel) {
            channel = channel.replace("https://kick.com/", "").replace("/", "").trim();
            document.getElementById('player').src = `https://player.kick.com/${channel}`;
            document.getElementById('chatPlayer').src = `https://kick.com/popout/${channel}/chat`;
        }

        function fetchVod() {
            let url = document.getElementById('vodUrl').value.trim();
            if(!url) return alert("يرجى إدخال رابط البث المسجل!");

            let videoId = url.split('/videos/')[1] || url.split('/video/')[1];
            if (videoId) {
                // 1. تشغيل الفيديو عبر مشغل Kick الرسمية
                document.getElementById('player').src = `https://player.kick.com/video/${videoId}`;
                
                // 2. إظهار خيار التنزيل المباشر
                const downloadBox = document.getElementById('downloadBox');
                const downloadBtn = document.getElementById('downloadBtn');
                
                downloadBtn.href = `https://kicklet.app/vod-downloader`;
                downloadBtn.innerText = "⬇️ اضغط هنا لتنزيل فيديو البث المسجل مباشرة بصيغة MP4";
                downloadBox.style.display = "block";
            } else {
                alert("تأكد من إدخال رابط فيديو مسجل صحيح من Kick!");
            }
        }

        function toggleChat() {
            const chatBox = document.getElementById('chatBox');
            const toggleBtn = document.getElementById('toggleChatBtn');
            if (isChatVisible) {
                chatBox.style.display = 'none';
                toggleBtn.innerText = '💬 إظهار الشات';
                isChatVisible = false;
            } else {
                chatBox.style.display = 'block';
                toggleBtn.innerText = '💬 إخفاء الشات';
                isChatVisible = true;
            }
        }

        createButtons(mtStreamers, 'mtList');
        createButtons(top20Streamers, 'top20List');
    </script>
</body>
</html>
